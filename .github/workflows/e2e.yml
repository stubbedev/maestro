name: E2E

# The drop-in promise, checked against the real Composer 2.10.3 phar on real
# projects. It needs the network (Packagist, GitHub) and takes a while, so it
# runs weekly and on demand rather than on every push.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: zip, bz2
          tools: none

      - name: End-to-end against Composer
        env:
          MAESTRO_E2E: '1'
          MAESTRO_PHP_TESTS: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: go test -count=1 -timeout 4h -run 'TestE2E|TestAllFunctional' ./cmd/maestro

  # The same comparison on Windows, where Composer and maestro both run
  # natively: junctions, .bat bin proxies, cmd.exe for scripts, PHP_EOL
  # line endings, 7-Zip or ZipArchive for zips. Git for Windows' usr/bin
  # (bash's PATH) has the diff, bzip2 and xz the suite uses.
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      # Defender scans every file the tests write and every process they
      # start (php, git, cmd), which dominates the job's wall time.
      - name: Turn off Defender's real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: zip, bz2
          tools: none

      - name: End-to-end against Composer
        env:
          MAESTRO_E2E: '1'
          MAESTRO_PHP_TESTS: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: go test -count=1 -timeout 290m -run 'TestE2E|TestAllFunctional' ./cmd/maestro
