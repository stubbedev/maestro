name: E2E

# The drop-in promise, checked against the real Composer 2.10.3 phar on real
# projects. It needs the network (Packagist, GitHub) and takes a while, so it
# runs weekly and on demand rather than on every push.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip, bz2
          tools: none

      - name: End-to-end against Composer
        env:
          MAESTRO_E2E: '1'
          MAESTRO_PHP_TESTS: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: go test -count=1 -timeout 4h -run 'TestE2E|TestAllFunctional' ./cmd/maestro
