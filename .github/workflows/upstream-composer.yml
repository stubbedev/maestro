name: Upstream Composer

# maestro follows the latest Composer (docs/PORTING.md, "Following
# upstream"): an issue for every Composer release newer than the one it
# ports, and a PR moving the pin to the newest stable one, each opened
# once (tools/upstream/open-issues.sh, tools/upstream/bump-pr.sh).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # version_compare orders releases as Composer does; bump.sh reads the
      # phar's constants
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: none

      - name: Open an issue per new Composer release
        run: tools/upstream/open-issues.sh

      - name: Open the PR bumping the pin to the newest stable release
        run: tools/upstream/bump-pr.sh
