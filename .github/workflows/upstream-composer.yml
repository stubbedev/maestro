name: Upstream Composer

# maestro follows the latest Composer (docs/PORTING.md, "Following
# upstream"): an issue for every Composer release newer than the one it
# ports, opened once (tools/upstream/open-issues.sh).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  issues:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # version_compare orders releases as Composer does
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: none

      - name: Open an issue per new Composer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/upstream/open-issues.sh
