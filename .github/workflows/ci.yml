name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every job starts at once and none waits for another: the wall time is the
# slowest job's. Each restores a Go build cache that rolls forward with
# every commit (setup-go's own cache is keyed on go.sum alone, so it is
# saved once and then never refreshed, and every run recompiled most of
# the tree).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Go cache paths
        id: go
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --config=.golangci.yml --timeout=10m

  # The whole suite, oracle replays and differential tests included.

      # saved even when the tests fail: a red job must not leave the next
      # run to compile everything again
      - if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Go cache paths
        id: go
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-

      # php drives the plugin shim and script tests (MAESTRO_PHP_TESTS) and
      # the oracle-backed tests that skip without it.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        if: runner.os == 'Linux'
        with:
          php-version: '8.4'
          tools: none

      # The archive differential tests compare against the extractors
      # maestro reproduces: Info-ZIP UnZip 6.00 with UNICODE_SUPPORT (macOS's
      # /usr/bin/unzip has none) and GNU tar (macOS's tar is bsdtar).
      # setup-php takes ~90 s on macOS (it updates Homebrew and its tap);
      # Homebrew's own php@8.4 bottle installs in a fraction of that.
      - name: php and reference extractors (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
        run: |
          brew install php@8.4 unzip gnu-tar
          echo "$(brew --prefix php@8.4)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix php@8.4)/bin/php" -v
          echo "MAESTRO_TEST_UNZIP=$(brew --prefix unzip)/bin/unzip" >> "$GITHUB_ENV"
          echo "MAESTRO_TEST_TAR=$(brew --prefix gnu-tar)/bin/gtar" >> "$GITHUB_ENV"
          "$(brew --prefix unzip)/bin/unzip" -v | grep -E 'UnZip 6|UNICODE_SUPPORT'

      - name: Test
        env:
          MAESTRO_PHP_TESTS: '1'
        run: go test ./...

  # The race detector multiplies the cost of the single-threaded oracle
  # replays and differential tests without finding anything in them; -short
  # skips those (the test job runs them) and keeps every concurrent path.

      # saved even when the tests fail: a red job must not leave the next
      # run to compile everything again
      - if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Go cache paths
        id: go
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: none

      - name: Test with the race detector
        env:
          CGO_ENABLED: '1'
          MAESTRO_PHP_TESTS: '1'
        run: go test -race -short ./...

  # The PHP shim runs on the project's php, which can be as old as Composer
  # 2.10.3's minimum (7.2.5); the test job covers 8.4.

      # saved even when the tests fail: a red job must not leave the next
      # run to compile everything again
      - if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
  php-7_2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Go cache paths
        id: go
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '7.2'
          tools: none

      - name: Plugin and command tests
        env:
          MAESTRO_PHP_TESTS: '1'
        run: go test ./internal/plugin/... ./internal/command

  # Composer runs on Windows: the suite there covers junctions, .bat bin
  # proxies, paths, cmd.exe escaping, the package store's locking and the
  # plugin runtime's loopback TCP transport. The comparisons with the Unix
  # reference extractors skip themselves (Composer does not use them on
  # Windows).

      # saved even when the tests fail: a red job must not leave the next
      # run to compile everything again
      - if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
  # Sharded: internal/command and internal/plugin alone take minutes on
  # Windows (process and php startup), so each gets a runner of its own.
  windows:
    name: windows (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [command, plugin, rest]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Defender scans every object and test binary the toolchain writes,
      # which made the Go build several times slower than on Linux; the
      # runner is thrown away after the job.
      - name: Disable real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Go cache paths
        id: go
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: go-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: none

      # -short skips the large single-threaded oracle replays: they test
      # platform-independent logic, which the test job runs in full.
      - name: Test
        env:
          MAESTRO_PHP_TESTS: '1'
        run: |
          case "${{ matrix.shard }}" in
            command) pkgs=./internal/command/... ;;
            plugin) pkgs=./internal/plugin/... ;;
            *) pkgs=$(go list ./... | grep -v -e '/internal/command' -e '/internal/plugin') ;;
          esac
          # -count=1: caching a test result makes go test stat every file
          # and directory the tests touched, which on Windows took minutes
          # after internal/command's tests had passed
          # shellcheck disable=SC2086 # one word per package
          go test -count=1 -short $pkgs

      # saved even when the tests fail: a red job must not leave the next
      # run to compile everything again
      - if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Go cache paths
        id: go
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-

      - name: Build every release target
        env:
          CGO_ENABLED: '0'
        run: |
          go mod download
          printf '%s\n' linux/amd64 linux/arm64 linux/386 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64 freebsd/arm64 |
            xargs -P "$(nproc)" -I{} sh -c 't={}; GOOS="${t%/*}" GOARCH="${t#*/}" go build -o /dev/null ./cmd/maestro && echo "ok $t"'

      # saved even when the tests fail: a red job must not leave the next
      # run to compile everything again
      - if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
