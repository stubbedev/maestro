version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - intrange
    - misspell
    - modernize
    - nolintlint
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        # A package manager's whole job is reading and writing paths it is
        # handed (composer.json, vendor/, the cache), and vendor/ must be
        # world-readable exactly as Composer leaves it. Paths that come from
        # archives are validated where they are read (internal/store).
        - G301 # directory permissions above 0750
        - G304 # file path from a variable
        - G703 # path traversal via taint analysis: same reason as G304
        - G306 # WriteFile permissions above 0600
        # errcheck owns unchecked errors, with its exclude-functions above.
        - G104 # errors unhandled
    perfsprint:
      strconcat: true
      sprintf1: true
    revive:
      rules:
        # Stub doc comments are noise; package docs carry the context.
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/stubbedev/maestro)
  exclusions:
    generated: lax
