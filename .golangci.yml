version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - forbidigo
    - gosec
    - intrange
    - misspell
    - modernize
    - nolintlint
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    forbidigo:
      analyze-types: true
      forbid:
        # PHP's getcwd() and realpath() are internal/php's (#63): os.Getwd
        # may answer $PWD (a symlinked path), filepath.Abs cleans ".."
        # before symlinks are resolved, and filepath.EvalSymlinks misses
        # Windows junctions.
        - pattern: ^os\.Getwd$
          msg: "use php.Getcwd (getcwd(), the physical directory) or util.GetCwd"
        - pattern: ^filepath\.Abs$
          msg: "use php.Realpath (realpath() resolves symlinks before it cleans ..)"
        - pattern: ^filepath\.EvalSymlinks$
          msg: "use php.Realpath or php.EvalSymlinks (junctions on Windows)"
    gosec:
      excludes:
        # A package manager's whole job is reading and writing paths it is
        # handed (composer.json, vendor/, the cache), and vendor/ must be
        # world-readable exactly as Composer leaves it. Paths that come from
        # archives are validated where they are read (internal/store).
        - G301 # directory permissions above 0750
        - G304 # file path from a variable
        - G703 # path traversal via taint analysis: same reason as G304
        - G306 # WriteFile permissions above 0600
        # errcheck owns unchecked errors, with its exclude-functions above.
        - G104 # errors unhandled
    perfsprint:
      strconcat: true
      sprintf1: true
    revive:
      rules:
        # Stub doc comments are noise; package docs carry the context.
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - forbidigo
          - gosec
          - unparam
      # internal/php owns the path builtins; test helpers and build tools
      # work with the test's or developer's directories as Go sees them
      - path: ^(internal/php/|internal/testutil/|internal/command/commandtest/|internal/util/processmock/|internal/plugin/shimbuild/|tools/)
        linters:
          - forbidigo

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/stubbedev/maestro)
  exclusions:
    generated: lax
