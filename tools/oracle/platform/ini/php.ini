; The php.ini of the "custom-ini" oracle variant: settings maestro reads,
; and functions Composer's Runtime calls disabled.
short_open_tag = Off
memory_limit = 256M
allow_url_fopen = Off
disable_functions = inet_pton,php_uname,curl_version
openssl.cafile = /etc/ssl/custom.pem
date.timezone = Europe/Copenhagen
